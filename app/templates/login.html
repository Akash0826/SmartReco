<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartReco LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .vibrant-bg {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 50%, #e0c3fc 100%);
            background-size: 200% 200%;
            animation: gradientShift 12s ease infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.75;
            animation: float 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #fbc2eb 0%, #a6c1ee 100%);
            top: -50px;
            left: -50px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ffecd2 0%, #fcb69f 100%);
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) scale(1);
            }

            100% {
                transform: translateY(-30px) scale(1.08);
            }
        }
    </style>
</head>

<body class="vibrant-bg min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div class="orb orb-1 pointer-events-none"></div>
    <div class="orb orb-2 pointer-events-none"></div>

    <div
        class="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 md:p-10 border border-white/60">

        <div class="flex justify-center mb-6">
            <div
                class="w-14 h-14 bg-slate-900 rounded-full flex items-center justify-center shadow-lg text-white text-2xl font-black">
                ⚡</div>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug">Welcome to
                SmartReco</h1>
            <p class="text-sm text-slate-500 font-medium mt-2">Please log in to your account.</p>
        </div>

        <!-- Role-Based Login Form -->
        <form action="/auth/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Email
                    Address</label>
                <input type="email" name="email" placeholder="admin@smartreco.com or user@smartreco.com" required
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all bg-white shadow-sm font-medium">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Password</label>
                <input type="password" name="password" placeholder="••••••••" required
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all bg-white shadow-sm font-medium">
            </div>

            <button type="submit"
                class="w-full py-3.5 px-6 bg-slate-900 hover:bg-slate-800 text-white font-bold text-base rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 font-medium">
            <p>Demo Accounts:</p>
            <p class="mt-1">Admin: <b>admin@smartreco.com</b> | Pass: <b>admin123</b></p>
            <p>User: <b>user@smartreco.com</b> | Pass: <b>user123</b></p>
        </div>
    </div>
</body>

</html>
