{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">My Enrolled Courses</h2>

    <!-- Tailwind Grid Layout -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        {% for course in products %}
        <!-- Tailwind Card -->
        <div
            class="bg-white shadow-md rounded-lg border border-gray-200 flex flex-col h-full overflow-hidden hover:shadow-lg transition-shadow duration-200">

            <!-- Card Body -->
            <div class="p-6 flex-grow">
                <span
                    class="inline-block px-3 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded-full mb-3">
                    Enrolled
                </span>
                <h5 class="text-xl font-bold text-blue-900 mb-2">{{ course.title }}</h5>
                <p class="text-gray-600 text-sm leading-relaxed">{{ course.description }}</p>
            </div>

            <!-- Card Footer (Side-by-Side Small Buttons) -->
            <div class="p-4 pt-3 mt-auto bg-gray-50 border-t border-gray-100 flex flex-row gap-2">

                <!-- Primary Action: Continue Learning -->
                <a href="/products/{{ course.id }}"
                    class="flex-1 text-center px-3 py-1.5 bg-blue-600 text-white text-sm font-bold rounded flex items-center justify-center hover:bg-blue-700 transition-colors duration-200">
                    Learn
                </a>

                <!-- Secondary Action: Unenroll -->
                <form action="/unenroll" method="POST"
                    onsubmit="return confirm('Are you sure you want to unenroll from this course?');"
                    class="flex-1 m-0 flex">
                    <input type="hidden" name="product_id" value="{{ course.id }}">
                    <button type="submit"
                        class="w-full text-center px-3 py-1.5 border border-red-500 text-red-500 hover:bg-red-500 hover:text-white text-sm font-bold rounded transition-colors duration-200">
                        Unenroll
                    </button>
                </form>

            </div>

        </div>
        {% else %}
        <!-- Fallback Empty State -->
        <div class="col-span-full text-center py-16 bg-gray-50 rounded-lg border border-gray-200">
            <h5 class="text-lg font-medium text-gray-600">You are not enrolled in any courses yet.</h5>
            <a href="/products"
                class="inline-block mt-4 px-6 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors">
                Browse Catalog
            </a>
        </div>
        {% endfor %}

    </div>
</div>
{% endblock %}
